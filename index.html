<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>資源教室經費管理系統</title>
  <link rel="stylesheet" href="./styles.css?v=1.3.11" />
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div id="loginView" class="center-page">
    <div class="login-card">
      <div class="brand-mark">資</div><h1>資源教室經費管理系統</h1>
      <p>明新科技大學資源教室｜內部經費登錄與管理</p>
      <button id="loginBtn" class="primary-btn">使用 Google 帳號登入</button>
      <p class="hint">僅限已授權之資源教室教師使用</p>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <header class="topbar">
      <div><div class="eyebrow">MUST RESOURCE ROOM</div><h1>經費管理系統</h1></div>
      <div class="user-box"><div><strong id="userName">—</strong> <span id="roleBadge" class="role-badge">—</span></div><small id="userEmail">—</small><button id="logoutBtn" class="ghost-btn">登出</button></div>
    </header>

    <div class="panel" style="margin-bottom:16px;display:flex;gap:12px;align-items:end;flex-wrap:wrap">
      <label style="min-width:280px;flex:1">目前計畫<select id="planSelect"><option value="">尚未建立計畫</option></select></label>
      <button id="newPlanBtn" class="primary-btn manager-only">＋ 建立計畫</button>
      <button id="editPlanBtn" class="ghost-btn manager-only">調整計畫</button>
      <button id="deletePlanBtn" class="ghost-btn manager-only" style="color:#b42318;border-color:#efb2b2">刪除計畫</button>
    </div>
    <div id="inactivePlanNotice" class="inactive-plan hidden">此計畫已停用：不可新增使用紀錄或新增經費項目；既有資料仍可查看與依權限修改。</div>

    <nav class="tabs"><button class="tab active" data-view="dashboard">總覽</button><button class="tab" data-view="records">使用紀錄</button><button class="tab manager-only" data-view="budget">經費編列</button></nav>

    <main>
      <section id="dashboard" class="view active-view">
        <div class="section-head"><div><h2>經費總覽</h2><p id="planSummary">請先選擇計畫。</p></div></div>
        <div id="summaryCards" class="summary-grid"></div>
        <div id="adminTodoPanel" class="panel manager-only hidden"></div>
        <div class="panel"><div class="panel-head"><h3>經費項目</h3><span id="categoryCount" class="muted"></span></div><div id="budgetTableWrap"></div></div>
      </section>

      <section id="records" class="view">
        <div class="section-head responsive-head">
          <div><h2>使用紀錄</h2><p id="recordsHint">登錄經費使用紀錄。</p></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button id="batchDownloadBtn" class="ghost-btn manager-only hidden">批次下載核銷單據</button><button id="newRecordBtn" class="primary-btn">＋ 新增使用紀錄</button></div>
        </div>
        <div class="panel filters review-filters">
          <select id="filterCategory"><option value="">全部經費項目</option></select>
          <select id="filterSemester"><option value="">全部學期</option></select>
          <select id="filterReview"><option value="">全部核銷狀態</option><option value="pending">待核對</option><option value="approved">已核銷</option><option value="estimated">預估</option></select>
          <select id="filterIssue"><option value="">全部資料狀態</option><option value="missingVoucher">缺少核銷單據</option><option value="unconfirmed">未確認 Key 金額</option></select>
          <input id="searchInput" placeholder="搜尋用途、老師或學期" />
        </div>
        <div id="recordList" class="record-list"></div>
      </section>

      <section id="budget" class="view manager-only">
        <div class="section-head responsive-head"><div><h2>經費編列</h2><p>先設定計畫總額，再將額度分配至各經費項目。</p></div><button id="newCategoryBtn" class="primary-btn">＋ 新增經費項目</button></div>
        <div id="allocationSummary" class="panel" style="margin-bottom:16px"></div><div class="panel"><div id="categoryAdminList"></div></div>
      </section>
    </main>
  </div>

  <dialog id="planDialog"><form id="planForm" method="dialog" class="dialog-form">
    <div class="dialog-head"><h3 id="planDialogTitle">建立計畫</h3><button type="button" class="icon-btn" data-close="planDialog">×</button></div>
    <input type="hidden" id="planId" />
    <label>計畫名稱<input id="planName" required maxlength="120" placeholder="例如：115年度身心障礙學生輔導工作計畫" /></label>
    <div class="two-cols"><label>年度<input id="planYear" required placeholder="115" /></label><label>期別<select id="planTerm"><option value="年度">年度</option><option value="上學期">上學期</option><option value="下學期">下學期</option></select></label></div>
    <label>計畫總核定額度<input id="planTotalBudget" required type="number" min="0" step="1" /></label>
    <label class="check-row"><input id="planActive" type="checkbox" checked /><span>啟用此計畫</span></label>
    <div class="dialog-actions"><button type="button" class="ghost-btn" data-close="planDialog">取消</button><button class="primary-btn" value="default">儲存</button></div>
  </form></dialog>

  <dialog id="recordDialog"><form id="recordForm" method="dialog" class="dialog-form">
    <div class="dialog-head"><h3 id="recordDialogTitle">新增使用紀錄</h3><button type="button" class="icon-btn" data-close="recordDialog">×</button></div>
    <input type="hidden" id="recordId" />
    <label>經費項目<select id="recordCategory" required></select></label>
    <label>用途／摘要<input id="recordPurpose" required maxlength="120" placeholder="例如：A4影印紙" /></label>
    <div class="two-cols"><label>金額<input id="recordAmount" required type="number" min="0" step="1" /></label><label>學期<input id="recordSemester" required maxlength="5" pattern="\d{3}-[12]" placeholder="例如：114-2、115-1" /></label></div>
    <label class="check-row estimate-row"><input id="recordEstimated" type="checkbox" /><span><strong>此筆為預估金額</strong><small>預估金額可跳過核銷單據與金額確認，會先扣除「計畫剩餘額度」，但不計入「已核銷」。</small></span></label>

    <div class="voucher-upload">
      <label>核銷單據（預估可空白）<input id="recordVoucherFile" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" /></label>
      <p id="voucherRequirementHint" class="hint">正式送核銷前，請上傳核銷單據並確認單據金額與 Key 的金額相同。</p>
      <div id="existingVoucherBox" class="existing-voucher hidden"></div>
      <label id="uploadConfirmWrap" class="check-row confirm-row"><input id="recordArchived" type="checkbox" /><span><strong>我已上傳核銷單據</strong></span></label>
      <label id="manualConfirmWrap" class="check-row confirm-row"><input id="recordAmountConfirm" type="checkbox" /><span><strong>請確定核銷單據是否與 Key 的金額相同</strong><small>確認無誤後勾選；非預估資料必須勾選才能儲存。</small></span></label>
    </div>
    <label>備註<textarea id="recordNote" rows="3" maxlength="500"></textarea></label>
    <div class="dialog-actions"><button type="button" class="ghost-btn" data-close="recordDialog">取消</button><button id="recordSaveBtn" class="primary-btn" value="default">儲存</button></div>
  </form></dialog>

  <dialog id="categoryDialog"><form id="categoryForm" method="dialog" class="dialog-form">
    <div class="dialog-head"><h3 id="categoryDialogTitle">新增經費項目</h3><button type="button" class="icon-btn" data-close="categoryDialog">×</button></div>
    <input type="hidden" id="categoryId" />
    <label>項目名稱<input id="categoryName" required maxlength="80" /></label><label>編列額度<input id="categoryBudget" required type="number" min="0" step="1" /></label><label>排序<input id="categoryOrder" type="number" min="0" step="1" value="0" /></label>
    <label class="check-row"><input id="categoryActive" type="checkbox" checked /><span>啟用此經費項目</span></label>
    <label>調整備註<textarea id="categoryReason" rows="3" maxlength="300"></textarea></label>
    <div class="dialog-actions"><button type="button" class="ghost-btn" data-close="categoryDialog">取消</button><button class="primary-btn" value="default">儲存</button></div>
  </form></dialog>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="./budget-private-assets-v123.js?v=1.3.11"></script>
  <script type="module" src="./app-v128-loader.js?v=1.3.11"></script>
  <script type="module" src="./budget-admin-patch-v121.js?v=1.3.11"></script>
  <script type="module" src="./budget-attachment-delete-v126.js?v=1.3.11"></script>
  <script type="module" src="./budget-batch-category-v127.js?v=1.3.11"></script>
  <script type="module" src="./budget-trash-v128.js?v=1.3.11"></script>
  <script type="module" src="./budget-ui-state-v129.js?v=1.3.11"></script>
  <script type="module" src="./budget-private-open-fix-v132.js?v=1.3.11"></script>
  <script type="module" src="./budget-stable-remaining-v133.js?v=1.3.11"></script>
  <script type="module" src="./budget-no-voucher-request-v137.js?v=1.3.11"></script>
  <script type="module" src="./budget-manager-waiver-click-v139.js?v=1.3.11"></script>
</body>
</html>
