name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  permissions:
    uses: ./.github/workflows/permissions.yml
  deploy:
    needs: permissions
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for uploaded artifact metadata
        uses: actions/github-script@v7
        env:
          BUDGET_PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        with:
          script: |
            const name = process.env.BUDGET_PAGES_ARTIFACT;
            for (let attempt = 0; attempt < 12; attempt++) {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, name
              });
              const found = response.data.artifacts.filter(a => a.name === name && !a.expired);
              if (found.length === 1) { core.info('Pages artifact metadata is ready.'); return; }
              if (found.length > 1) throw new Error('Duplicate Pages artifact metadata.');
              core.info('Waiting for Pages artifact metadata...');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Uploaded Pages artifact metadata did not become available.');

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
